[package]
name = "tacle-sequential-rs"
version = "0.1.0"
edition = "2024"

[features]
log = ["cortex-m/critical-section-single-core"]

[dependencies]
libm = "0.2.11"

[target.thumbv7em-none-eabihf.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
rtt-target = "0.6.1"
panic-halt = "1.0.0"
panic-rtt-target = "0.2.0"

#
# --- sequential ---
# 
[[bin]]
name = "adpcm_dec"
path = "src/adpcm_dec/adpcm_dec.rs"
