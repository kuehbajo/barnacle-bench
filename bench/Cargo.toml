[workspace]
resolver = "2"
members = [
    "kernel",
    "sequential",
    "test",
    "app",
]

[profile.release]
debug = true
lto = true
panic = "abort"

[profile.O0]
inherits = "release"
opt-level = 0

[profile.O1]
inherits = "release"
opt-level = 1

[profile.O2]
inherits = "release"
opt-level = 2

[profile.O3]
inherits = "release"
opt-level = 3

[profile.Os]
inherits = "release"
opt-level = "s"

[profile.Oz]
inherits = "release"
opt-level = "z"
