[alias]
ba = ["build", "--target", "thumbv7em-none-eabihf"]

[target.thumbv7em-none-eabihf]
linker = "arm-none-eabi-gcc"
runner = "arm-none-eabi-gdb -x openocd.gdb"

rustflags = [
    # Usual Arm bare-metal linker setup
    "-Clink-arg=-marm",
    "-Clink-arg=-mcpu=cortex-m4",
    "-Clink-arg=-mthumb",
    "-Clink-arg=-D__FPU_PRESENT",
    "-Clink-arg=-mfpu=fpv4-sp-d16",
    "-Clink-arg=-mfloat-abi=hard",
    "-Clink-arg=--specs=nosys.specs",
    "-Clink-arg=--specs=nano.specs",
    "-Clink-arg=-Os",
    "-Clink-arg=-T../common/linker_script.ld",
    "-Clink-arg=-L../common/build/O0",
    "-Clink-arg=-lc",
    "-Clink-arg=-lm",
    "-Clink-arg=-lnosys",
    "-Clink-arg=-lxmc-startup",
    "-Clink-arg=-Wl,-Map=./target/thumbv7em-none-eabihf/xmc-flash.map,--cref",
    "-Clink-arg=-Wl,--gc-sections",
    # tell Rust we have a Cortex-M4
    "-Ctarget-cpu=cortex-m4",
    #"-Ctarget-feature=",
    #"-o=target.elf"
]

